<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login | VerifAI</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <script>
        (function() {
            const saved = localStorage.getItem('verifai-theme') || 'dark';
            if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
        })();
    </script>
</head>
<body>
    <div class="ambient-glow"></div>
    <div class="mesh-bg"></div>
    <div class="grid-overlay"></div>
    <div class="cursor-glow" id="cursor-glow"></div>
    <div class="floating-shapes">
        <div class="shape shape--hex"></div>
        <div class="shape shape--ring"></div>
        <div class="shape shape--diamond"></div>
        <div class="shape shape--cross"></div>
    </div>
    <nav class="topbar">
        <div class="topbar-inner">
            <a href="/" class="brand">
                <svg viewBox="0 0 24 24" style="width:1.5rem;height:1.5rem;margin-right:0.5rem;vertical-align:middle;">
                    <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" fill="currentColor"/>
                </svg>
                VerifAI
            </a>
            <div class="nav-links" style="gap:0.75rem;">
                <a href="/login" class="btn btn-sm btn-brand">Sign In</a>
                <a href="/signup" class="btn btn-sm btn-ghost">Create Account</a>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme" style="margin-left: 0.5rem;">
                    <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                </button>
            </div>
        </div>
    </nav>
    <main class="container" style="padding-top: 8rem; ">
        <div class="card fade-up visible" style="padding: 2.5rem; text-align: center;">
            <div class="portal-icon" style="margin: 0 auto 1.5rem auto; background: var(--indigo-glow); color: var(--indigo);">
                <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
            </div>
            <h2 class="hero-title" style="font-size: 2rem; margin-bottom: 0.5rem;">Welcome Back</h2>
            <p class="text-secondary" style="margin-bottom: 2rem;">Log in to your VerifAI account</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="badge badge-{{ 'success' if category == 'success' else 'warning' }}" style="display:block; margin-bottom: 1.5rem; padding: 0.75rem;">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="post" action="/login" style="text-align: left;">
                <div style="margin-bottom: 1.25rem;">
                    <label style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Username</label>
                    <input type="text" name="username" class="input" placeholder="Enter username" required>
                </div>
                <div style="margin-bottom: 2rem;">
                    <label style="display:block; margin-bottom: 0.5rem; font-size: 0.9rem; font-weight: 600; color: var(--text-secondary);">Password</label>
                    <input type="password" name="password" class="input" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-brand btn-block" style="padding: 1rem; font-size: 1.1rem;">
                    Sign In &rarr;
                </button>
            </form>
            
            <div style="margin-top: 2rem; font-size: 0.9rem;">
                <span class="text-secondary">New to VerifAI?</span>
                <a href="/signup" style="color: var(--indigo); font-weight: 600; text-decoration: none; margin-left: 0.5rem;">Create account</a>
            </div>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/particles.js"></script>
</body>
</html>
