<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Provider Portal | VerifAI</title>
  <link rel="stylesheet" href="/static/css/main.css">
  <script>
    (function() {
      const saved = localStorage.getItem('verifai-theme') || 'dark';
      if (saved === 'light') document.documentElement.setAttribute('data-theme', 'light');
    })();
  </script>
</head>
<body>
  <div class="ambient-glow"></div>
  <div class="mesh-bg"></div>
  <div class="grid-overlay"></div>
  <div class="cursor-glow" id="cursor-glow"></div>
  <div class="floating-shapes">
    <div class="shape shape--hex"></div>
    <div class="shape shape--ring"></div>
    <div class="shape shape--diamond"></div>
    <div class="shape shape--cross"></div>
    <div class="shape shape--hex"></div>
    <div class="shape shape--ring"></div>
    <div class="shape shape--diamond"></div>
    <div class="shape shape--cross"></div>
    <div class="shape shape--hex"></div>
    <div class="shape shape--ring"></div>
    <div class="shape shape--diamond"></div>
    <div class="shape shape--cross"></div>
  </div>

  <nav class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        VerifAI
      </a>
      <div class="nav-links">
        <a href="/">Overview</a>
        <a href="/provider" class="active">Provider</a>
        <a href="/user">User</a>
        <a href="/verifier">Verifier</a>
      </div>
      <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme" title="Toggle light/dark theme">
        <svg class="icon-moon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
        <svg class="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
      </button>
    </div>
  </nav>

  <main class="container">
    <div class="flex-between fade-up" style="margin-bottom: 2rem;">
      <div>
        <h1 style="display:flex; align-items:center; gap:0.75rem;">
          <svg style="width:2rem;height:2rem;color:var(--indigo)" viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          Model Provider Dashboard
        </h1>
        <p class="text-secondary" style="margin-top:0.5rem;">Manage parameters and published state commitments.</p>
      </div>
      <div>
        <label style="font-size:0.85rem; color:var(--text-muted); display:block; margin-bottom:0.25rem;">Active Model</label>
        <select id="model-select" class="select-input" style="min-width:200px;"></select>
      </div>
    </div>

    <div class="card fade-up" style="transition-delay: 0.1s;">
      <div class="flex-between" style="margin-bottom: 1.5rem;">
        <h3 class="card-title" style="margin-bottom: 0;">Registered Model Commitments</h3>
        <label class="btn btn-brand btn-sm" style="cursor: pointer; display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 1rem;">
          <svg style="width:1rem;height:1rem" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
          Upload Commitment
          <input type="file" id="upload-commitment-input" accept=".bin" style="display: none;">
        </label>
      </div>

      <table class="tbl">
        <thead>
          <tr>
            <th style="width: 25%">Layer Idx</th>
            <th style="width: 40%">Parameter Key</th>
            <th style="width: 15%">Filesize</th>
            <th style="width: 20%">State</th>
          </tr>
        </thead>
        <tbody id="commits-body">
          <!-- Populated by JS -->
          <tr><td colspan="4" style="text-align:center; padding: 2rem; color: var(--text-muted)">Loading registry...</td></tr>
        </tbody>
      </table>
    </div>
  </main>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
  <script src="/static/js/particles.js"></script>
  <script src="/static/js/main.js"></script>
</body>
</html>
